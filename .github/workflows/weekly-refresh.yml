name: Weekly COT Refresh

# RETIRED 2026-06-18 (INIT-22): cot-cta is being decommissioned. Its CTA trend
# (trigger) layer is folded into cot-monitor; macro-satellite no longer ingests
# this repo. The weekly schedule is disabled to stop auto-refresh + auto-deploy;
# kept manual-only during the transition. Final teardown (archive repo + disable
# GitHub Pages) is a manual Settings step.
on:
  workflow_dispatch:        # Manual only — scheduled refresh disabled (retired)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    env:
      # S13c (INIT-22): set this repo secret to source COT cohorts from data-core
      # (the guarded base). ABSENT -> the base/collectors checkouts are skipped and
      # scripts/fetch_cot.py falls back to its CFTC fetch (production unchanged —
      # strangler: the dashboard never stops). data-core is private (needs the PAT);
      # collectors is public.
      DATACORE_PAT: ${{ secrets.DATACORE_PAT }}
    outputs:
      data_changed: ${{ steps.commit.outputs.data_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---- S13c: COT cohorts come FROM data-core; only present when PAT is set ----
      - name: Checkout data-core (private base)
        if: ${{ env.DATACORE_PAT != '' }}
        uses: actions/checkout@v4
        with:
          repository: tsvetoslavtsachev/data-core
          token: ${{ env.DATACORE_PAT }}
          path: .data-core
      - name: Checkout collectors (consumer lib)
        if: ${{ env.DATACORE_PAT != '' }}
        uses: actions/checkout@v4
        with:
          repository: tsvetoslavtsachev/collectors
          path: .collectors

      - name: Fetch COT data
        env:
          # When the checkouts ran, fetch_cot sources the cohort rows from the base;
          # otherwise these point at absent dirs and it transparently uses CFTC.
          DATACORE_ROOT: ${{ github.workspace }}/.data-core
          PYTHONPATH: ${{ github.workspace }}/.collectors
        run: python scripts/fetch_cot.py

      - name: Build derived metrics
        run: python scripts/derive_metrics.py

      - name: Build CTA replication model
        run: python scripts/cta_model.py

      - name: Generate AI context file
        run: python scripts/generate_ai_context.py

      - name: Commit refreshed data if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "data_changed=false" >> $GITHUB_OUTPUT
            echo "No data changes to commit."
          else
            git commit -m "data: weekly COT refresh $(date -u +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
            echo "data_changed=true" >> $GITHUB_OUTPUT
          fi

  deploy-pages:
    needs: refresh-data
    runs-on: ubuntu-latest
    if: ${{ needs.refresh-data.outputs.data_changed == 'true' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main   # Always deploy from latest main after data commit

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # Serve entire repo root (index.html + data/)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
